<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111713">
  <meta name="robots" content="noindex">
  <title>Sem conexão — Fifa GO</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #111713; color: #f2f5ee; }
    * { box-sizing: border-box; }
    body { display: grid; place-items: center; margin: 0; min-height: 100svh; padding: max(28px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
    main { width: min(100%, 440px); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 56px; font-size: 18px; font-weight: 750; }
    .brand img { border-radius: 12px; }
    .eyebrow { color: #73e8a7; font-size: 12px; letter-spacing: .12em; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 12px 0 18px; font-size: clamp(34px, 8vw, 48px); line-height: 1.08; letter-spacing: -.035em; }
    .description { margin: 0 0 30px; color: #b4c1b6; font-size: 17px; line-height: 1.6; }
    .retry { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 22px; border-radius: 12px; background: #73e8a7; color: #0c2818; text-decoration: none; font-size: 16px; font-weight: 750; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .retry:active { background: #a5f0c4; }
    .retry:focus-visible { outline: 3px solid #f2f5ee; outline-offset: 4px; }
    .hint { margin-top: 18px; color: #91a497; font-size: 13px; line-height: 1.6; }
    @media (hover: hover) and (pointer: fine) { .retry:hover { background: #a5f0c4; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/assets/pwa/icons-192.png" alt="" width="44" height="44">Fifa GO</div>
    <p class="eyebrow">Pausa na conexão</p>
    <h1>A gente volta<br>ao jogo já.</h1>
    <p class="description">O Fifa GO precisa de internet para abrir sua conta e acompanhar as partidas.</p>
    <a class="retry" href="/#arena">Tentar novamente</a>
    <p class="hint">Quando sua conexão voltar, toque no botão para entrar na arena.</p>
  </main>
</body>
</html>
