# New virtual host only: do not replace nginx.conf or any existing site.
# Obtain the certificate with DNS validation before enabling this HTTPS
# template. Keep the existing default host by enabling this as zzz-fifago.
# Confirm `nginx -t` before a graceful reload.
# The ACME directory is separate from the application's private data.
server {
    listen 80;
    server_name betfifa.com.br;

    # Invite links carry an opaque token in the query string. Avoid storing it in access logs.
    access_log off;
    error_log /var/log/nginx/fifago.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/fifago-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://betfifa.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name betfifa.com.br;

    ssl_certificate /etc/letsencrypt/live/betfifa.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betfifa.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/fifago.access.log;
    error_log /var/log/nginx/fifago.error.log warn;
    client_max_body_size 6m;
    client_body_timeout 15s;

    # OAuth callback query strings can contain one-time authorization codes.
    # This exception applies only to Fifa GO; other virtual hosts are unchanged.
    location ~ ^/api/v1/auth/oauth/(google|apple)/callback$ {
        access_log off;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    # Invite URLs contain a one-time/shareable token in the query or path.
    location = / {
        access_log off;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location = /index.html {
        access_log off;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location ^~ /api/v1/invites/ {
        access_log off;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/fifago-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite client-supplied headers. Backend may trust this address
        # only when its direct peer is the loopback reverse proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
}
